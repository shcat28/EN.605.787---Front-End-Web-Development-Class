<!DOCTYPE html>
<html lang="en" ng-app="LunchCheck">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lunch Checker</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="container" ng-controller="LunchCheckController">

    <h1>Lunch Quantity Checker</h1>

    <p>
      Enter the items you usually eat for lunch, separated by commas.
    </p>

    <input
      type="text"
      ng-model="lunchItems"
      ng-class="inputClass"
      placeholder="Example: sandwich, apple, chips">

    <!-- Empty items between commas, such as ", ," are not counted as lunch items. -->
    <p class="note">
      Note: Empty items between commas (for example, ", ,") are not counted.
    </p>

    <button ng-click="checkLunch()">
      Check If Too Much
    </button>

    <p class="message" ng-class="messageClass">
      {{message}}
    </p>

  </div>

  <!-- AngularJS -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

  <!-- Our AngularJS application -->
  <script src="app.js"></script>

</body>
</html>
