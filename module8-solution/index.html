
<!DOCTYPE html>
<html lang="en" ng-app="NarrowItDownApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narrow It Down</title>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="app.js"></script>
</head>
<body>

  <h1>Narrow Down Your Menu Choices</h1>

  <div ng-controller="NarrowItDownController as narrow">

    <input type="text"
           ng-model="narrow.searchTerm"
           placeholder="Search menu descriptions">

    <button ng-click="narrow.search()">
      Narrow It Down For Me!
    </button>

    <found-items
      found="narrow.found"
      on-remove="narrow.removeItem(index)">
    </found-items>

    <p ng-if="narrow.searched && narrow.found.length === 0">
      Nothing found
    </p>

    <p ng-if="narrow.error">
      Unable to retrieve menu items. Please try again.
    </p>

  </div>

</body>
</html>
